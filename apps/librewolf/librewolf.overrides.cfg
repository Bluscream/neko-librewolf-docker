// neko + agent use: a persistent, controllable browser rather than LibreWolf's forget-everything default.
// Keep cookies, logins and the session across restarts.
defaultPref("privacy.sanitize.sanitizeOnShutdown", false);
defaultPref("privacy.clearOnShutdown.cookies", false);
defaultPref("privacy.clearOnShutdown_v2.cookiesAndStorage", false);
defaultPref("privacy.clearOnShutdown.history", false);
defaultPref("privacy.clearOnShutdown_v2.historyFormDataAndDownloads", false);
defaultPref("browser.startup.page", 3);
defaultPref("signon.rememberSignons", true);
// The streamed window has a fixed size; letterboxing would add borders to the stream.
defaultPref("privacy.resistFingerprinting.letterboxing", false);
// WebGL off by default in LibreWolf breaks some sites; the container has no GPU anyway (software GL).
defaultPref("webgl.disabled", false);
// neko defaults (from its Firefox app)
defaultPref("browser.tabs.closeWindowWithLastTab", false);
defaultPref("browser.shell.checkDefaultBrowser", false);
defaultPref("browser.download.useDownloadDir", false);
defaultPref("browser.download.folderList", 2);
defaultPref("ui.systemUsesDarkTheme", 1);
defaultPref("browser.theme.toolbar-theme", 0);
defaultPref("devtools.theme", "dark");
