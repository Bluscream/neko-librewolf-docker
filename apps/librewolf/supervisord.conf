[program:librewolf]
environment=HOME="/home/%(ENV_USER)s",USER="%(ENV_USER)s",DISPLAY="%(ENV_DISPLAY)s"
command=/usr/bin/librewolf --no-remote -P default --display=%(ENV_DISPLAY)s -setDefaultBrowser
stopsignal=INT
autorestart=true
priority=800
user=%(ENV_USER)s
stdout_logfile=/var/log/neko/librewolf.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
redirect_stderr=true

[program:openbox]
environment=HOME="/home/%(ENV_USER)s",USER="%(ENV_USER)s",DISPLAY="%(ENV_DISPLAY)s"
command=/usr/bin/openbox --config-file /etc/neko/openbox.xml
autorestart=true
priority=300
user=%(ENV_USER)s
stdout_logfile=/var/log/neko/openbox.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
redirect_stderr=true

[program:foxmcp]
environment=HOME="/home/%(ENV_USER)s",USER="%(ENV_USER)s"
; The extension connects to the WebSocket on 8765; agents use MCP over HTTP on 8770. Both bind in the
; container. The socat forward below makes MCP reachable on 8771; publish that port only where you trust the clients.
command=/opt/foxmcp/bin/foxmcp --host 127.0.0.1 --port 8765 --mcp-port 8770
directory=/home/%(ENV_USER)s
autorestart=true
priority=900
user=%(ENV_USER)s
stdout_logfile=/var/log/neko/foxmcp.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
redirect_stderr=true

[program:foxmcp-forward]
; FoxMCP's MCP server only listens on localhost inside the container; this makes it reachable on
; container port 8771 (publish it to a trusted interface only, e.g. 127.0.0.1 or the docker bridge).
command=/usr/bin/socat TCP-LISTEN:8771,fork,reuseaddr TCP:localhost:8770
autorestart=true
priority=950
user=%(ENV_USER)s
stdout_logfile=/var/log/neko/foxmcp-forward.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=1
redirect_stderr=true
